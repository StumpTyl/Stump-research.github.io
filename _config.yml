################################################################################
# Basic Site Settings
################################################################################

locale: "en-US"
title: "Tyler James Stump"
description: "Academic website of Tyler James Stump, PhD Candidate in Engineering Education at The Ohio State University"

################################################################################
# USER SITE SETTINGS (CRITICAL)
################################################################################

url: "https://stumptyl.github.io"
baseurl: ""                   # MUST be empty for *.github.io repos
repository: "StumpTyl/Stump-research.github.io"

################################################################################
# Author Profile
################################################################################

author:
  name: "Tyler James Stump"
  bio: "PhD Candidate in Engineering Education at The Ohio State University specializing in quantitative research methods, psychometric validation, Bayesian item response theory, and inclusive assessment design."
  location: "Columbus, Ohio, USA"
  employer: "The Ohio State University"
  email: "stump.211@buckeyemail.osu.edu"
  github: "StumpTyl"
  orcid: "0000-0002-1264-858X"

################################################################################
# Collections
################################################################################

collections:
  pages:
    output: true
    permalink: /:path/
  publications:
    output: true
  talks:
    output: true
  teaching:
    output: true

################################################################################
# Includes
################################################################################

include:
  - _pages

################################################################################
# Defaults
################################################################################

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

################################################################################
# Plugins
################################################################################

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
